;  Deus Ex: Human Revolution - Director's Cut - Head Tracking configuration
;  Lives next to DXHRDC.exe in the game install root.

[General]
EnableOnStartup=1
Port=4242
DataFreshnessMs=500
;  Yaw mode: true = horizon-locked yaw (default), false = camera-local.
WorldSpaceYaw=1
PositionEnabled=1
;  Stop the lean where the level does: the eye is held off walls by asking
;  the game's own collision, instead of passing through them.
LeanCollision=1
;  How far off a surface to hold the eye, in metres. Anything below the
;  camera's near clip plane is raised to clear it - closer than that the
;  wall is not drawn at all and you see through it.
LeanCollisionSkin=0.19
;  What head tracking does while the sights are up. Cycled in game with Insert.
;    paused  - tracking stands down until the weapon comes down (default)
;    marker  - tracking stays live, and a white cross marks where rounds land
;    tracked - tracking stays live, nothing drawn
AdsMode=paused
;  Discovery aid only: dump the camera matrix to the log instead of tracking.
CameraDump=0
;  Discovery aid only: sweep the reticle across the screen instead of
;  correcting it, to check the game moves it where this mod asks.
ReticleProbe=0

[Sensitivity]
Yaw=1
Pitch=1
Roll=1
InvertYaw=0
InvertPitch=0
InvertRoll=0

[Smoothing]
;  Smoothing applied when the tracker runs on this machine (loopback).
;  0 = no smoothing, 1 = heavy. Covers rotation and position.
LocalSmoothing=0
;  Smoothing applied when the tracker is a remote device on the network.
;  0 = no smoothing, 1 = heavy. Covers rotation and position.
RemoteSmoothing=0.15
DeadzoneDeg=0

[Hotkeys]
;  Virtual-key codes. Defaults: End (toggle), Page Up (cycle tracking mode), Page Down (yaw mode), Insert (ADS mode).
Toggle=0x23
Position=0x21
YawMode=0x22
Ads=0x2D
;  Chord alternatives: Ctrl+Shift+Y (toggle), Ctrl+Shift+G (cycle tracking mode), Ctrl+Shift+H (yaw mode), Ctrl+Shift+U (ADS mode).
ChordToggle=1
ChordPosition=1
ChordYawMode=1
ChordAds=1
